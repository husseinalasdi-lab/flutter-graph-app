name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Project Structure
        run: |
          mkdir temp_code
          cp -r lib temp_code/ || true
          cp pubspec.yaml temp_code/ || true
          flutter create --org com.example graph_app
          cp -r graph_app/android ./
          cp -r graph_app/ios ./ 2>/dev/null || true
          rm -rf graph_app temp_code

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GraphApp-release
          path: build/app/outputs/flutter-apk/app-release.apk
